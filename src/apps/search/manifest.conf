# Runtime kind manifest, read by src/types/runtime/type.sh.
KIND=search
DESCRIPTION=Full-text scripture search (the librarian's search)
PACKAGE=getbible_search_api
WSGI=getbible_search_api.wsgi:app
CHECK=getbible_search_api.check
ENV_PREFIX=SEARCH
DEFAULT_VERSION=v2
SUPPORTED_VERSIONS=v2
METHODS=GET|HEAD|POST|OPTIONS
MAX_BODY=16k
CACHE_SECONDS=60
WORKERS=2
THREADS=4
TIMEOUT_START=180
TIMEOUT_STOP=45
MEMORY_HIGH=2G
MEMORY_MAX=3G
CPU_QUOTA=400%
TASKS_MAX=128
NOFILE=8192
WARM_TRANSLATIONS=kjv
