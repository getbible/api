[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getbible-search-api"
version = "2.0.0"
description = "The getBible search endpoint: full-text search over a translation."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["Flask>=3.1,<4", "getbible>=2.1,<3", "getbible-api-common"]

[tool.setuptools.packages.find]
where = ["."]
include = ["getbible_search_api*"]
