[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "getbible-query-api"
version = "2.0.0"
description = "The getBible query endpoint: scripture references to verses."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["Flask>=3.1.3,<4", "getbible>=3.0,<4", "getbible-api-common"]

[tool.setuptools.packages.find]
where = ["."]
include = ["getbible_query_api*"]
