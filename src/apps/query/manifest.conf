# Runtime kind manifest, read by src/types/runtime/type.sh.
KIND=query
DESCRIPTION=Scripture references to verses (the librarian's select)
PACKAGE=getbible_query_api
WSGI=getbible_query_api.wsgi:app
CHECK=getbible_query_api.check
ENV_PREFIX=QUERY
DEFAULT_VERSION=v2
SUPPORTED_VERSIONS=v2
ROUTE=GET /{version}/{translation}/{reference}
METHODS=GET|HEAD|OPTIONS
MAX_BODY=1k
CACHE_SECONDS=300
WORKERS=4
THREADS=4
TIMEOUT_START=90
TIMEOUT_STOP=30
MEMORY_HIGH=384M
MEMORY_MAX=512M
CPU_QUOTA=200%
TASKS_MAX=64
NOFILE=4096
WARM_TRANSLATIONS=
