[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "getbible-api-common"
version = "1.0.0"
description = "Shared HTTP plumbing for the getBible runtime API endpoints."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["Flask>=3.1.3,<4", "getbible>=3.0,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["getbible_api_common*"]
