[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getbible-api-common"
version = "1.0.0"
description = "Shared HTTP plumbing for the getBible runtime API endpoints."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["Flask>=3.1,<4", "getbible>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["getbible_api_common*"]
