# getBible API - every nginx-generated error is an RFC 9457 problem document.
error_page 400 = @gb_error_400;
error_page 401 = @gb_error_401;
error_page 403 404 = @gb_error_404;
error_page 405 = @gb_error_405;
error_page 413 = @gb_error_413;
error_page 429 = @gb_error_429;
error_page 500 502 503 504 = @gb_error_5xx;

location @gb_error_400 {
    internal;
    include snippets/getbible/headers.conf;
    add_header Cache-Control "no-store" always;
    types { }
    default_type application/problem+json;
    return 400 '{"type":"https://getbible.net/problems/bad-request","title":"Bad Request","status":400,"code":"bad_request","detail":"This endpoint does not accept query strings or malformed requests.","instance":"urn:request:$request_id"}\n';
}

location @gb_error_401 {
    internal;
    include snippets/getbible/headers.conf;
    add_header Cache-Control "no-store" always;
    add_header WWW-Authenticate 'Bearer realm="getbible"' always;
    types { }
    default_type application/problem+json;
    return 401 '{"type":"https://getbible.net/problems/unauthorized","title":"Unauthorized","status":401,"code":"unauthorized","detail":"A valid bearer token is required for this endpoint. See the documentation at the domain root.","instance":"urn:request:$request_id"}\n';
}

location @gb_error_404 {
    internal;
    include snippets/getbible/headers.conf;
    add_header Cache-Control "public, max-age=60" always;
    types { }
    default_type application/problem+json;
    return 404 '{"type":"https://getbible.net/problems/not-found","title":"Not Found","status":404,"code":"not_found","detail":"No such resource on this API. The documentation at the domain root lists the available versions and paths.","instance":"urn:request:$request_id"}\n';
}

location @gb_error_405 {
    internal;
    include snippets/getbible/headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Allow "GET, HEAD, OPTIONS" always;
    types { }
    default_type application/problem+json;
    return 405 '{"type":"https://getbible.net/problems/method-not-allowed","title":"Method Not Allowed","status":405,"code":"method_not_allowed","detail":"This resource only answers GET, HEAD and OPTIONS requests.","instance":"urn:request:$request_id"}\n';
}

location @gb_error_413 {
    internal;
    include snippets/getbible/headers.conf;
    add_header Cache-Control "no-store" always;
    types { }
    default_type application/problem+json;
    return 413 '{"type":"https://getbible.net/problems/payload-too-large","title":"Payload Too Large","status":413,"code":"payload_too_large","detail":"The request body exceeds what this endpoint accepts.","instance":"urn:request:$request_id"}\n';
}

location @gb_error_429 {
    internal;
    include snippets/getbible/headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    types { }
    default_type application/problem+json;
    return 429 '{"type":"https://getbible.net/problems/rate-limited","title":"Too Many Requests","status":429,"code":"rate_limited","detail":"The public request budget for your address is exhausted. Token holders are not limited; see the documentation at the domain root.","instance":"urn:request:$request_id"}\n';
}

location @gb_error_5xx {
    internal;
    include snippets/getbible/headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    types { }
    default_type application/problem+json;
    return 503 '{"type":"https://getbible.net/problems/unavailable","title":"Service Unavailable","status":503,"code":"unavailable","detail":"The service is temporarily unavailable. Retry shortly.","instance":"urn:request:$request_id"}\n';
}
