# Default host and container liveness. Domain vhosts are managed normally.
server {
    listen 80 default_server;
    server_name _;
    default_type application/problem+json;
    location = /__getbible_health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ready"}';
    }
    location / {
        add_header Cache-Control "no-store" always;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"No API domain matches this request hostname."}';
    }
}
