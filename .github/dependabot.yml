version: 2

# Updates are proposed for review. Releases still require the version decision
# in .github/PULL_REQUEST_TEMPLATE.md and the existing acceptance checks.
updates:
  - package-ecosystem: pip
    directories:
      - /src/apps/common
      - /src/apps/query
      - /src/apps/search
      - /src/apps/mcp
      - /src/python
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Librarian 3 requires filelock <4; exclude known vulnerable 3.x releases.
    # A future patched 3.x release remains eligible for review.
    ignore:
      - dependency-name: filelock
        versions: [">=4", ">=3.20.4,<=3.32.7"]
      # getbible-mcp 2.1.3 requires SDK 2.2.0; revisit when its pin changes.
      # Only this incompatible release is excluded; future releases stay eligible.
      - dependency-name: mcp
        versions: ["2.3.0"]
      - dependency-name: mcp-types
        versions: ["2.3.0"]
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-versions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/apps/dashboard/ui
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      dashboard-security:
        applies-to: security-updates
        patterns: ["*"]
      dashboard-versions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
