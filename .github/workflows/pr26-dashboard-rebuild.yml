name: PR 26 dashboard rebuild

on:
  push:
    branches:
      - dependabot/npm_and_yarn/src/apps/dashboard/ui/dashboard-versions-e4095b38bf
    paths:
      - .github/workflows/pr26-dashboard-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'getbible/api' && github.ref == 'refs/heads/dependabot/npm_and_yarn/src/apps/dashboard/ui/dashboard-versions-e4095b38bf'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and test the locked dashboard
        working-directory: src/apps/dashboard/ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Commit the regenerated dashboard to this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git add -- src/apps/dashboard/static
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="$(git show -s --format=%an "$GITHUB_SHA")" \
              -c user.email="$(git show -s --format=%ae "$GITHUB_SHA")" \
              commit -m "fix: rebuild dashboard assets for the locked dependency update"
          git push origin "HEAD:$GITHUB_REF"
