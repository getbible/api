name: CI

on:
  push:
    branches: [master, main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ubuntu ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "24.04"
            python: "3.12"
          - os: "24.04"
            python: "3.13"
          - os: "26.04"
            python: "3.14"
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Keep apt on the Ubuntu archives
        # The runner image adds Google Chrome and Microsoft package feeds whose
        # indexes can be inconsistent for a while after a release ("Hash Sum
        # mismatch"), which fails apt-get update before any test runs. Nothing
        # installed here comes from them.
        run: |
          for list in /etc/apt/sources.list.d/*; do
            if sudo grep -qsE 'dl\.google\.com|packages\.microsoft\.com' "$list"; then
              sudo rm -f -- "$list"
            fi
          done
      - name: Install nginx, shellcheck and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx haproxy shellcheck rsync logrotate openssh-client openssh-server whiptail acl
          sudo systemctl stop nginx || true
      - name: Lint, unit and command line tests
        run: tests/run.sh
      - name: Integration tests (real nginx, gunicorn and SSH)
        run: |
          sudo -E env "PATH=$PATH" tests/integration/static.sh
          sudo -E env "PATH=$PATH" tests/integration/runtime.sh
          sudo -E env "PATH=$PATH" bash tests/integration/runtime_rollback.sh
          sudo -E env "PATH=$PATH" bash tests/integration/deploy_keys.sh
          sudo -E env "PATH=$PATH" bash tests/integration/external_proxy.sh
          sudo -E env "PATH=$PATH" bash tests/integration/mcp.sh

  systemd:
    name: Production services / Ubuntu ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Keep apt on the Ubuntu archives
        # The runner image adds Google Chrome and Microsoft package feeds whose
        # indexes can be inconsistent for a while after a release ("Hash Sum
        # mismatch"), which fails apt-get update before any test runs. Nothing
        # installed here comes from them.
        run: |
          for list in /etc/apt/sources.list.d/*; do
            if sudo grep -qsE 'dl\.google\.com|packages\.microsoft\.com' "$list"; then
              sudo rm -f -- "$list"
            fi
          done
      - name: Install the deployment prerequisites using the host's Python
        run: sudo ./getbible.sh install-deps --yes
      - name: Actual systemd deployment, upgrades, permissions and recovery
        shell: bash
        run: |
          sudo env GB_CI_DISPOSABLE_HOST=1 tests/integration/systemd.sh 2>&1 | tee /tmp/getbible-systemd-test.log
      - name: Capture the service journal on failure
        if: failure()
        run: sudo journalctl -u 'getbible-*' --no-pager -n 500 > /tmp/getbible-systemd-journal.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: systemd-ubuntu-${{ matrix.os }}
          path: /tmp/getbible-systemd-*.log
          retention-days: 7
