name: Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep each main build and its publication together. A newer merge never
# interrupts acceptance or races another run while moving registry tags.
concurrency:
  group: docker-main
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    name: Verify merged main commit and image version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.release.outputs.build }}
      image_version: ${{ steps.release.outputs.image_version }}
      numbered_version: ${{ steps.release.outputs.numbered_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Plan merged main image
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_MAIN: ${{ github.event.before }}
        run: |
          printf 'build=false\n' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ]]; then exit 0; fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$PREVIOUS_MAIN" =~ ^[0-9a-f]{40}$ ]]
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$RUNNER_TEMP/merged-prs.json"
          merged="$(python3 -c 'import json, os, sys
          merged = any(pr["merged_at"] is not None and pr["base"]["ref"] == "main"
                       and pr["base"]["repo"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
                       and pr["merge_commit_sha"] == os.environ["GITHUB_SHA"]
                       for page in json.load(sys.stdin) for pr in page)
          print(str(merged).lower())' < "$RUNNER_TEMP/merged-prs.json")"
          if [[ "$merged" != true ]]; then
            echo 'No pull request was merged into main at this commit; image build skipped.'
            exit 0
          fi
          # The committed version is the reviewed release input. Recheck it
          # against the actual previous main commit, including merges that
          # raced another release after their pull-request checks completed.
          python3 scripts/release-version.py check --base-ref "$PREVIOUS_MAIN"
          version="$(python3 -c 'from pathlib import Path; print(Path("VERSION").read_text().strip())')"
          printf 'build=true\nimage_version=%s\nnumbered_version=%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Image / ${{ matrix.arch }}
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the complete image and verify all bundled runtimes
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: getbible-api-test:ci
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            GETBIBLE_VERSION=${{ needs.plan.outputs.image_version }}
            GETBIBLE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=getbible-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=getbible-${{ matrix.arch }}
      - name: Install HAProxy for the real forwarding acceptance test
        run: |
          for list in /etc/apt/sources.list.d/*; do
            if sudo grep -qsE 'dl\.google\.com|packages\.microsoft\.com' "$list"; then
              sudo rm -f -- "$list"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y haproxy shellcheck
      - name: Lint image entry points and test ownership restoration and release guards
        run: |
          shellcheck -x -s bash docker/*.sh tests/integration/docker.sh
          python3 -m unittest tests.python.test_identities tests.python.test_docker_release -v
      - name: Real systemd, offline deployment, HAProxy, token access and recreation
        run: tests/integration/docker.sh
      - name: Preserve the exact tested image for publication
        run: docker image save getbible-api-test:ci | gzip -1 > /tmp/getbible-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/getbible-image.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish tested image / ${{ matrix.arch }}
    needs: [plan, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.arch }}
          path: /tmp
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image that passed acceptance
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker load --input /tmp/getbible-image.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:sha-$GITHUB_SHA-$IMAGE_ARCH"
          docker tag getbible-api-test:ci "$tag"
          docker push "$tag"

  manifest:
    name: Publish multi-architecture manifest
    needs: [plan, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish merged main manifest and numbered release
        env:
          NUMBERED_VERSION: ${{ needs.plan.outputs.numbered_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$NUMBERED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'A numbered release is required.' >&2; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sources=("$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64")
          candidate="$image:sha-$GITHUB_SHA"
          docker buildx imagetools create -t "$candidate" "${sources[@]}"
          # Resolve main before changing stable tags. A failed lookup must not
          # leave a partial numbered release that cannot be retried safely.
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$main_head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid main revision from GitHub.' >&2; exit 1; }
          if [[ -n "$NUMBERED_VERSION" ]]; then
            [[ "$NUMBERED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            # A failed lookup is never evidence that an immutable tag is absent.
            package_tags="${RUNNER_TEMP:?}/getbible-package-tags"
            gh api --paginate "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/api/versions?per_page=100" \
              --jq '.[].metadata.container.tags[]' > "$package_tags"
            if grep -Fxq "$NUMBERED_VERSION" "$package_tags"; then
              # Retrying after a later publication failure may find the number
              # already present. Only the exact accepted manifest is reusable.
              docker buildx imagetools inspect --raw "$image:$NUMBERED_VERSION" > "$RUNNER_TEMP/numbered-manifest.json"
              docker buildx imagetools inspect --raw "$candidate" > "$RUNNER_TEMP/candidate-manifest.json"
              if ! cmp -s "$RUNNER_TEMP/numbered-manifest.json" "$RUNNER_TEMP/candidate-manifest.json"; then
                echo "Release $NUMBERED_VERSION already exists with a different manifest; numbered releases are never overwritten." >&2
                exit 1
              fi
              echo "Release $NUMBERED_VERSION already contains this accepted image; retaining it."
            else
              docker buildx imagetools create -t "$image:$NUMBERED_VERSION" "$candidate"
            fi
          fi
          # Workflows are serialized, and an old rerun must not move latest
          # behind the currently accepted main image. A newer main commit
          # receives latest only after its own build and acceptance complete.
          if [[ "$main_head" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create -t "$image:latest" "$candidate"
          else
            echo 'Main has advanced; preserving latest for the newer merged commit.'
          fi
