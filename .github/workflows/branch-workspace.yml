name: Integrate management release lifecycle

on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/branch-workspace.yml']

permissions:
  contents: write

concurrency:
  group: management-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/dependable-upgrades-capacity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Integrate the reviewed management implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit('Source differs; refusing an ambiguous edit: ' + old[:100])
              return text.replace(old, new, 1)
          p = Path('src/lib/dashboard.sh')
          text = p.read_text()
          if 'source "$GB_LIB/management-release.sh"' not in text:
              pattern = re.compile(r'^dashboard_release_manifest\(\) \(\n.*?^\)\n', re.M | re.S)
              text, count = pattern.subn('', text)
              if count != 1: raise SystemExit('Cannot identify release manifest function')
              for function in ('infrastructure_install', 'infrastructure_reporting_prepare', 'infrastructure_update'):
                  pattern = re.compile(r'^' + function + r'\(\) \{\n.*?^\}\n', re.M | re.S)
                  text, count = pattern.subn('', text)
                  if count != 1: raise SystemExit('Cannot identify lifecycle function: ' + function)
              text = once(text, 'GB_DASHBOARD_LOADED=1\n', 'GB_DASHBOARD_LOADED=1\n# shellcheck source=management-release.sh\nsource "$GB_LIB/management-release.sh"\n')
              text = text.replace('"$GB_LIBEXEC/apps/dashboard/release.json"', '"$(management_release_file)"')
              text = once(text, "printf 'DASHBOARD_RELEASE_FILE=%s/apps/dashboard/release.json\\n' \"$GB_LIBEXEC\"", "printf 'DASHBOARD_RELEASE_FILE=%s\\n' \"$(management_release_file)\"")
              text = once(text, 'running_latest=bool(serving and source == installed == serving)', 'running_latest=bool(serving and source.get("fingerprint") == installed.get("fingerprint") == serving.get("fingerprint"))')
              p.write_text(text)
          p = Path('src/lib/management-release.sh')
          text = p.read_text()
          if '"MANAGEMENT_RELEASE=' not in text:
              text = once(text, '            "SYSTEMCTL=$GB_SYSTEMCTL" "NGINX_USER=$GB_NGINX_USER"', '            "MANAGEMENT_RELEASE=${GB_MANAGEMENT_CANDIDATE:-$GB_LIBEXEC}" \\\n            "SYSTEMCTL=$GB_SYSTEMCTL" "NGINX_USER=$GB_NGINX_USER"')
          if '# Fresh installations retain' not in text:
              text = once(text, '    done\n}\n\nmanagement_release_recover()', '''    done
              # Fresh installations retain the historical inspection path. Existing
              # package directories stay untouched for pre-adoption processes.
              if [[ ! -e "$GB_LIBEXEC/apps" && ! -L "$GB_LIBEXEC/apps" ]]; then
                  ln -s -- "$(management_release_root)/current/apps" "$GB_LIBEXEC/apps" || return 1
              fi
          }

          management_release_recover()''')
          p.write_text(text)
          helpers = ('getbible-admin-broker', 'getbible-dashboard', 'getbible-telemetry', 'getbible-runtime-control', 'getbible-adapt', 'getbible-resources', 'getbible-storage-guard')
          units = ('getbible-prepare.service', 'getbible-admin.service', 'getbible-dashboard.service', 'getbible-telemetry.service', 'getbible-adapt.service', 'getbible-storage.service')
          for unit in units:
              p = Path('src/systemd') / (unit + '.tmpl')
              text = p.read_text()
              for helper in helpers:
                  text = text.replace('{{LIBEXEC}}/' + helper, '{{MANAGEMENT_RELEASE}}/bin/' + helper)
              text = text.replace('{{LIBEXEC}}/apps/dashboard/static', '{{MANAGEMENT_RELEASE}}/apps/dashboard/static')
              p.write_text(text)
          PY
          bash -n src/lib/management-release.sh src/lib/dashboard.sh getbible.sh
          python3 -m unittest discover -s tests/python -p test_management_releases.py -v
          temporary="$(mktemp -d)"
          trap 'rm -rf -- "$temporary"' EXIT
          python3 src/bin/getbible-management-release stage --source "$PWD" --root "$temporary/management"
          GB_PREFIX="$temporary/system" GB_UI=none bash getbible.sh dashboard status --yes
          git diff --check
      - name: Commit actual integration to the existing branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add src/lib/dashboard.sh src/lib/management-release.sh src/systemd
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate staged management releases without duplicate reporting restarts'
          git push origin "HEAD:$BRANCH"
