name: Search dispatch verification sources
on:
  push:
    branches: [fix/search-reference-dispatch]
    paths: [.github/workflows/search-fixtures.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Export snapshot and public test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search-sources/wheels"
          git archive HEAD > "$RUNNER_TEMP/search-sources/api.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/search-sources/api-revision.txt"
          python -m pip download --only-binary=:all: flask getbible jsonschema pytest requests gunicorn pydantic python-dotenv -d "$RUNNER_TEMP/search-sources/wheels"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: search-upstream-sources
          path: ${{ runner.temp }}/search-sources/
          retention-days: 3
