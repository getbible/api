name: Release version

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    name: Release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch current main for release review
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Review the committed version and PR decision
        run: python3 scripts/release-version.py check --base-ref origin/main --event "$GITHUB_EVENT_PATH"
